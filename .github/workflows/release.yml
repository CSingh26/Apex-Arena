# SPDX-License-Identifier: AGPL-3.0-only
name: Verify and publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # Lets a maintainer force a full rebuild/republish/redeploy from the
  # Actions UI without a throwaway commit - e.g. to recover a component
  # whose image never actually finished publishing after a superseded or
  # partially-failed run.
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      postgres: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.postgres == 'true' }}
      redis: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.redis == 'true' }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            postgres:
              - 'deploy/docker/postgres/**'
            redis:
              - 'deploy/docker/redis/**'

  backend:
    name: Backend quality gate
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://apex:task24-synthetic@localhost:5432/apex_e2e_ci
      POSTGRES_PASSWORD: task24-synthetic
      REDIS_URL: redis://localhost:6379/15
      TEST_REPLAY_POSTGRES_URL: postgresql+asyncpg://apex:task24-synthetic@localhost:5432/apex_e2e_ci
      TEST_INGESTION_POSTGRES_URL: postgresql+asyncpg://apex:task24-synthetic@localhost:5432/apex_e2e_ci
      TEST_E2E_DATABASE_URL: postgresql://apex:task24-synthetic@localhost:5432/apex_e2e_ci
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: apex_e2e_ci
          POSTGRES_USER: apex
          POSTGRES_PASSWORD: task24-synthetic
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U apex -d apex_e2e_ci"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install backend and test tools
        working-directory: backend
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Verify formatting
        working-directory: backend
        run: ruff format --check app tests
      - name: Lint backend
        working-directory: backend
        run: ruff check app tests
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Frontend quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Run frontend tests
        run: npm test
      - name: Build production frontend
        env:
          NEXT_PUBLIC_APP_NAME: Apex Arena
          NEXT_PUBLIC_APP_URL: http://localhost:3417
          NEXT_PUBLIC_API_URL: http://localhost:8764
        run: npm run build

  containers:
    name: Build and scan containers
    needs: [backend, frontend, changes]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: backend
            context: backend
            dockerfile: backend/Dockerfile
            changed: "true"
            build_args: ""
          - component: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
            changed: "true"
            build_args: |
              NEXT_PUBLIC_APP_NAME=Apex Arena
              NEXT_PUBLIC_APP_URL=http://localhost:3417
              NEXT_PUBLIC_API_URL=http://localhost:8764
          - component: postgres
            context: deploy/docker/postgres
            dockerfile: deploy/docker/postgres/Dockerfile
            changed: ${{ needs.changes.outputs.postgres }}
            build_args: ""
          - component: redis
            context: deploy/docker/redis
            dockerfile: deploy/docker/redis/Dockerfile
            changed: ${{ needs.changes.outputs.redis }}
            build_args: ""
    steps:
      - uses: actions/checkout@v6
        if: matrix.changed == 'true'
      - uses: docker/setup-buildx-action@v4
        if: matrix.changed == 'true'
      - name: Build ${{ matrix.component }} verification image
        if: matrix.changed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: apex-arena-${{ matrix.component }}:verify
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Scan ${{ matrix.component }} image
        if: matrix.changed == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: apex-arena-${{ matrix.component }}:verify
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL

  end-to-end:
    name: Production end-to-end gate
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: apex-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_REPLAY_OPERATOR_PASSWORD: apex-e2e-synthetic-operator
    steps:
      - uses: actions/checkout@v6
      - name: Prepare isolated CI environment
        run: cp scripts/e2e.env.example .env.e2e.ci
      - name: Start isolated production-image test stack
        run: docker compose --env-file .env.e2e.ci -f docker-compose.e2e.yml up -d --build --wait --wait-timeout 180
      - name: Seed isolated replay discussion
        run: |
          docker compose --env-file .env.e2e.ci -f docker-compose.e2e.yml exec -T backend \
            python -m app.cli.seed_e2e_room --scenario normal-race --slug e2e-normal-race
      - name: Run responsive end-to-end suite
        run: docker compose --env-file .env.e2e.ci -f docker-compose.e2e.yml run --build --rm browser-tests
      - name: Preserve browser diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e-artifacts/
          if-no-files-found: ignore
      - name: Collect container logs on failure
        if: failure()
        run: docker compose --env-file .env.e2e.ci -f docker-compose.e2e.yml logs --no-color --tail=250
      - name: Stop CI stack
        if: always()
        run: docker compose --env-file .env.e2e.ci -f docker-compose.e2e.yml down --volumes --remove-orphans

  deployment-validation:
    name: Deployment configuration gate
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://apex:test-password@localhost:5432/apex_arena
      POSTGRES_PASSWORD: test-password
      REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install backend
        working-directory: backend
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Validate release workflow invariants
        run: scripts/test-release-workflow.sh .github/workflows/release.yml

      - name: Validate Railway manifests
        run: |
          python - <<'PY'
          import pathlib, sys, tomllib
          required = {"api", "ingestor", "combined"}
          found = set()
          for path in pathlib.Path("deploy/railway").glob("*.toml"):
              data = tomllib.loads(path.read_text())
              deploy = data.get("deploy", {})
              assert deploy.get("startCommand"), f"{path}: missing startCommand"
              assert deploy.get("healthcheckPath"), f"{path}: missing healthcheckPath"
              replicas = deploy.get("numReplicas")
              # A second ingestor would contend for the singleton advisory lease.
              assert replicas == 1, f"{path}: numReplicas must be 1, got {replicas}"
              found.add(path.stem)
          missing = required - found
          assert not missing, f"missing Railway manifests: {sorted(missing)}"
          print(f"validated Railway manifests: {sorted(found)}")
          PY

      - name: Validate managed datastore URL handling
        working-directory: backend
        run: |
          python - <<'PY'
          from app.core.settings import Settings

          # Neon's copy button emits libpq params that asyncpg cannot consume.
          neon = Settings(
              _env_file=None,
              app_env="staging",
              app_process_role="api",
              apex_arena_proxy_token="apex-ci-synthetic-proxy-token",
              database_url=(
                  "postgresql://u:p@ep-x.neon.tech/apex"
                  "?sslmode=require&channel_binding=require"
              ),
              redis_url="rediss://default:token@x.upstash.io:6379",
              postgres_password=None,
          )
          dsn = neon.async_database_url
          assert dsn.startswith("postgresql+asyncpg://"), dsn
          assert "ssl=require" in dsn and "sslmode" not in dsn, dsn
          assert "channel_binding" not in dsn, dsn
          assert neon.redis_dsn.startswith("rediss://")
          # A socket timeout under the blocking read window would flap SSE.
          assert neon.effective_redis_socket_timeout > 10
          print("managed datastore URL handling OK")
          PY

      - name: Reject unsafe production configuration
        working-directory: backend
        run: |
          python - <<'PY'
          from pydantic import ValidationError
          from app.core.settings import Settings

          # Every field is explicit: validators short-circuit on the first
          # error, so an ambient value would mask the case under test.
          base = dict(
              app_env="production",
              app_process_role="api",
              apex_arena_proxy_token="apex-ci-synthetic-proxy-token",
              database_url="postgresql://u:p@h/apex?ssl=require",
              redis_url="rediss://default:t@h:6379",
              postgres_password=None,
              openf1_live_auto_connect=False,
              debug_ingestion_enabled=False,
              room_diagnostics_enabled=False,
          )

          def rejected(match: str, **overrides: object) -> None:
              try:
                  Settings(_env_file=None, **{**base, **overrides})
              except ValidationError as exc:
                  assert match in str(exc), f"expected {match!r} in {exc}"
                  return
              raise AssertionError(f"production accepted unsafe config: {overrides}")

          rejected("APP_PROCESS_ROLE=all", app_process_role="all")
          rejected("cannot auto-connect", openf1_live_auto_connect=True)
          rejected("must use rediss", redis_url="redis://h:6379")
          rejected("must require TLS", database_url="postgresql://u:p@h/apex")
          rejected("DEBUG_INGESTION_ENABLED", debug_ingestion_enabled=True)
          rejected("ROOM_DIAGNOSTICS_ENABLED", room_diagnostics_enabled=True)
          print("production guards OK")
          PY

      - name: Verify process roles start
        working-directory: backend
        run: |
          python - <<'PY'
          from app.core.settings import Settings
          from app.ingestor import create_ingestor_app
          from app.main import create_app

          def settings(role: str) -> Settings:
              return Settings(
                  _env_file=None,
                  app_env="staging",
                  app_process_role=role,
                  apex_arena_proxy_token="apex-ci-synthetic-proxy-token",
                  database_url="postgresql://u:p@pooler/apex?ssl=require",
                  # Ingesting roles require the direct endpoint for the lease.
                  database_migration_url="postgresql://u:p@direct/apex?ssl=require",
                  redis_url="rediss://default:t@h:6379",
                  postgres_password=None,
                  debug_ingestion_enabled=False,
              )

          assert create_app(settings("api")) is not None
          assert create_ingestor_app(settings("ingestor")) is not None
          assert create_app(settings("all")) is not None
          assert create_ingestor_app(settings("all")) is not None

          # The API role must not be able to masquerade as the ingestor.
          try:
              create_ingestor_app(settings("api"))
          except RuntimeError:
              print("process roles OK")
          else:
              raise AssertionError("ingestor accepted APP_PROCESS_ROLE=api")
          PY

      - name: Check deployment scripts
        run: |
          bash -n scripts/run-production-migrations.sh
          bash -n scripts/smoke-test-deployment.sh
          # Must fail closed when no database URL is present.
          if (unset DATABASE_URL DATABASE_MIGRATION_URL; \
              scripts/run-production-migrations.sh --check >/dev/null 2>&1); then
            echo "migration script did not fail closed without a DSN" && exit 1
          fi
          echo "deployment scripts OK"

      - name: Scan tracked files for credentials
        run: |
          # Placeholder templates are tracked; real secrets must never be.
          if git ls-files | grep -E '^\.env$|^\.env\.(local|production|staging)$'; then
            echo "a real .env file is tracked" && exit 1
          fi
          if git grep -nIE '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' \
             -- . ':!*.lock' ':!package-lock.json'; then
            echo "possible credential committed" && exit 1
          fi
          echo "no credentials found in tracked files"

      - name: Check documentation links
        run: |
          python - <<'PY'
          import pathlib, re, sys

          broken = []
          for doc in pathlib.Path("docs").rglob("*.md"):
              text = doc.read_text(encoding="utf-8")
              for target in re.findall(r"\]\((?!https?://|#|mailto:)([^)#]+)", text):
                  candidate = (doc.parent / target.strip()).resolve()
                  repo_relative = pathlib.Path.cwd().resolve()
                  if not candidate.exists():
                      alt = (repo_relative / target.strip().lstrip("/")).resolve()
                      if not alt.exists():
                          broken.append(f"{doc}: {target}")
          if broken:
              print("broken documentation links:")
              print("\n".join(broken))
              sys.exit(1)
          print("documentation links OK")
          PY

  deploy-vercel-frontend:
    name: Deploy Apex Arena frontend to Vercel (opt-in)
    needs: [backend, frontend, containers, end-to-end, deployment-validation]
    if: github.ref == 'refs/heads/main' && vars.VERCEL_APEX_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v6
      - name: Confirm deployment credentials are present
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "VERCEL_TOKEN is not configured; refusing to deploy." && exit 1
          fi
          echo "Vercel deployment credentials present."
      - name: Deployment placeholder
        run: |
          echo "The Apex Arena Vercel project is not provisioned yet."
          echo "Follow docs/apex-arena-vercel-deployment.md before enabling this job."
          exit 1

  publish:
    name: Publish verified images to GHCR
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [backend, frontend, containers, end-to-end, deployment-validation, changes]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - component: backend
            context: backend
            dockerfile: backend/Dockerfile
            image: ghcr.io/csingh26/apex-arena-backend
            changed: "true"
            platforms: linux/amd64,linux/arm64
            build_args: ""
          - component: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
            image: ghcr.io/csingh26/apex-arena-frontend
            changed: "true"
            platforms: linux/amd64,linux/arm64
            build_args: |
              NEXT_PUBLIC_APP_NAME=Apex Arena
              NEXT_PUBLIC_APP_URL=http://localhost:3417
              NEXT_PUBLIC_API_URL=http://localhost:8764
          - component: postgres
            context: deploy/docker/postgres
            dockerfile: deploy/docker/postgres/Dockerfile
            image: ghcr.io/csingh26/apex-arena-postgres
            changed: ${{ needs.changes.outputs.postgres }}
            # The Postgres image is pinned to the volume's glibc initdb; keep
            # this single-arch so an arm64 build is never accidentally used.
            platforms: linux/amd64
            build_args: ""
          - component: redis
            context: deploy/docker/redis
            dockerfile: deploy/docker/redis/Dockerfile
            image: ghcr.io/csingh26/apex-arena-redis
            changed: ${{ needs.changes.outputs.redis }}
            platforms: linux/amd64,linux/arm64
            build_args: ""
    steps:
      - uses: actions/checkout@v6
        if: startsWith(github.ref, 'refs/tags/v') || matrix.changed == 'true'
      - uses: docker/setup-qemu-action@v4
        if: startsWith(github.ref, 'refs/tags/v') || matrix.changed == 'true'
      - uses: docker/setup-buildx-action@v4
        if: startsWith(github.ref, 'refs/tags/v') || matrix.changed == 'true'
      - name: Sign in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v') || matrix.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate container metadata
        if: startsWith(github.ref, 'refs/tags/v') || matrix.changed == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ github.sha }},enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Publish ${{ matrix.component }} image
        if: startsWith(github.ref, 'refs/tags/v') || matrix.changed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: ${{ matrix.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    name: Trigger Railway redeploy
    # Only main pushes deploy: a tag build publishes versioned images for
    # release but must never move what production is already running.
    if: github.ref == 'refs/heads/main'
    needs: [publish, changes]
    runs-on: ubuntu-latest
    environment: Production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Redeploy backend (apex-arena-backend:main)
        run: npx -y @railway/cli@latest redeploy --service apex-arena-backend --yes
      - name: Redeploy frontend (apex-arena-frontend:main)
        run: npx -y @railway/cli@latest redeploy --service apex-arena-frontend --yes
      # Postgres and Redis only redeploy when their own image actually
      # changed - bouncing a stateful datastore on an unrelated app commit
      # would be pure risk for no benefit.
      - name: Redeploy Postgres (apex-arena-postgres:main)
        if: needs.changes.outputs.postgres == 'true'
        run: npx -y @railway/cli@latest redeploy --service Postgres --yes
      - name: Redeploy Redis (apex-arena-redis:main)
        if: needs.changes.outputs.redis == 'true'
        run: npx -y @railway/cli@latest redeploy --service Redis --yes
